<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تتبع طلبي · خضرة براند</title>
<meta name="theme-color" content="#F4EFE4">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/brand/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/site.css">
<style>
  main { padding-bottom: 48px; max-width: 640px; }
  .done { text-align: center; padding: 28px 18px; }
  .done .ok { width: 64px; height: 64px; border-radius: 50%; background: var(--leaf-soft); color: var(--olive-deep); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
  .done h1 { margin: 0; font-family: var(--display); font-size: 40px; color: var(--olive-deep); }
  .num { font-size: 22px; font-weight: 700; letter-spacing: .5px; font-variant-numeric: tabular-nums; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
  .steps li { display: flex; gap: 14px; position: relative; padding-bottom: 22px; }
  .steps li:last-child { padding-bottom: 0; }
  .steps li::before { content: ""; position: absolute; inset-inline-start: 13px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
  .steps li:last-child::before { display: none; }
  .dot { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--paper); display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--paper); z-index: 1; }
  .steps li.done-step .dot { background: var(--olive); border-color: var(--olive); }
  .steps li.now .dot { border-color: var(--olive); box-shadow: 0 0 0 4px rgba(79, 107, 42, .15); }
  .steps b { display: block; }
  .steps span { font-size: 14px; color: var(--ink-soft); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
</style>
</head>
<body>
<div id="chrome-top"></div>
<main class="wrap">
  <div id="root" class="stack" style="padding-top:8px"><div class="skeleton" style="height:240px"></div></div>
</main>
<div id="chrome-bottom"></div>
<script type="module" src="js/site/track.js"></script>
</body>
</html>
