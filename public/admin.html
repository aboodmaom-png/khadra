<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة خضرة</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#33461B">
<link rel="manifest" href="admin.webmanifest">
<link rel="icon" href="assets/brand/icon-192.png">
<link rel="apple-touch-icon" href="assets/brand/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<!-- الدخول -->
<section id="login" class="login" hidden>
  <form id="loginForm" class="login-card" novalidate>
    <img src="assets/brand/logo.png" alt="خضرة براند" width="120" height="120">
    <h1>لوحة التحكم</h1>
    <div class="field"><label for="email">الإيميل</label><input class="input" id="email" type="email" autocomplete="username" dir="ltr" required></div>
    <div class="field"><label for="pass">كلمة السر</label><input class="input" id="pass" type="password" autocomplete="current-password" dir="ltr" required></div>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn block" type="submit">دخول</button>
  </form>
</section>

<!-- اللوحة -->
<div id="app" class="app" hidden>
  <nav class="side" aria-label="الأقسام">
    <div class="side-brand"><img src="assets/brand/wordmark.png" alt="خضرة براند" width="150" height="66"><span>لوحة التحكم</span></div>
    <a href="#home" data-nav="home"><span class="ic" data-ic="home"></span><span>الرئيسية</span></a>
    <a href="#orders" data-nav="orders"><span class="ic" data-ic="orders"></span><span>الطلبات</span><b class="dot-count" id="newCount" hidden></b></a>
    <a href="#products" data-nav="products"><span class="ic" data-ic="products"></span><span>المنتجات</span></a>
    <a href="#catalog" data-nav="catalog"><span class="ic" data-ic="catalog"></span><span class="lg">الأقسام والمناطق</span><span class="sm">الأقسام</span></a>
    <a href="#settings" data-nav="settings"><span class="ic" data-ic="settings"></span><span>الإعدادات</span></a>
    <button class="logout" id="logout" type="button">خروج</button>
  </nav>
  <main class="content">
    <header class="top">
      <h1 id="viewTitle">الرئيسية</h1>
      <div class="top-actions">
        <a class="ghost-btn" href="index.html" target="_blank" rel="noopener">الموقع</a>
        <span class="net" id="net" hidden>بدون نت</span>
      </div>
    </header>
    <section data-view="home" id="v-home"></section>
    <section data-view="orders" id="v-orders" hidden></section>
    <section data-view="products" id="v-products" hidden></section>
    <section data-view="catalog" id="v-catalog" hidden></section>
    <section data-view="settings" id="v-settings" hidden></section>
  </main>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header><button class="x" type="button" data-close aria-label="إغلاق">✕</button><h2 id="sheetTitle"></h2></header>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/admin/main.js"></script>
</body>
</html>
