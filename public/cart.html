<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>السلة · خضرة براند</title>
<meta name="theme-color" content="#F4EFE4">
<link rel="icon" href="assets/brand/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/site.css">
<style>
  main { padding-bottom: 40px; }
  .cols { display: grid; gap: 14px; }
  @media (min-width: 960px) { .cols { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; } .side { position: sticky; top: 104px; } }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .item { display: flex; gap: 12px; padding-block: 14px; border-top: 1px solid #EDE4D3; }
  .item:first-child { border-top: 0; padding-top: 0; }
  .item:last-child { padding-bottom: 0; }
  .item img { width: 72px; height: 72px; border-radius: 14px; object-fit: cover; flex: none; background: var(--cream-2); }
  .item .bd { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .item .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .item .nm { font-weight: 600; line-height: 1.45; }
  .item .rm { border: 0; background: transparent; color: #8A7E6A; cursor: pointer; padding: 4px; margin: -4px; border-radius: 8px; }
  .item .row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .qty { display: inline-flex; align-items: center; gap: 2px; border: 1.5px solid var(--line-strong); border-radius: 12px; padding: 2px; }
  .qty b { min-width: 26px; text-align: center; }
  .qty button { width: 34px; height: 34px; border-radius: 9px; border: 0; background: transparent; color: var(--olive-deep); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qty button svg { width: 16px; height: 16px; }
  .tagline { align-self: flex-start; font-size: 12px; font-weight: 600; border-radius: 12px; padding: 2px 9px; }
  .free { background: #EEF2E2; border: 1px solid #CFDDB0; border-radius: 18px; padding: 12px 14px; font-size: 14px; font-weight: 600; color: #2E4116; }
  .bar { height: 8px; border-radius: 4px; background: #DCE5C6; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--olive); border-radius: 4px; }
  .h3 { margin: 0; font-size: 17px; font-weight: 700; }
  .pays { display: grid; gap: 10px; }
  @media (min-width: 560px) { .pays { grid-template-columns: 1fr 1fr; } }
  .pay { position: relative; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; border: 1.5px solid var(--line-strong); background: var(--paper); cursor: pointer; transition: border-color .15s, background .15s; }
  .pay input { position: absolute; opacity: 0; pointer-events: none; }
  .pay .pay-ic { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--cream-2); color: var(--olive-deep); display: flex; align-items: center; justify-content: center; }
  .pay b { display: block; font-size: 15px; }
  .pay .muted { display: block; font-size: 12.5px; line-height: 1.5; }
  .pay::after { content: ""; flex: none; margin-inline-start: auto; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-strong); }
  .pay:has(input:checked) { border-color: var(--olive); background: #EEF2E2; box-shadow: inset 0 0 0 1px var(--olive); }
  .pay:has(input:checked) .pay-ic { background: var(--olive); color: var(--paper); }
  .pay:has(input:checked)::after { border: 6px solid var(--olive); background: var(--paper); }
  .pay:has(input:focus-visible) { outline: 3px solid var(--bronze-line); outline-offset: 2px; }
  .sumrow { display: flex; justify-content: space-between; padding-block: 3px; color: #4A4234; }
  .sumrow.total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 12px; font-size: 18px; font-weight: 700; color: var(--ink); }
</style>
</head>
<body>
<div id="chrome-top"></div>
<main class="wrap">
  <div class="page-h"><h1>السلة</h1></div>
  <div id="root"><div class="skeleton" style="height:200px"></div></div>
</main>
<div id="chrome-bottom"></div>
<script type="module" src="js/site/cart.js"></script>
</body>
</html>
